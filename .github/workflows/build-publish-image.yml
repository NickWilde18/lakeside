name: Build And Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: Release tag to publish, for example v1.2.3
        required: true
        type: string
      image_name:
        description: Optional image name under ghcr.io/<owner>/...
        required: false
        default: ""
        type: string
      publish_latest:
        description: Also publish the latest tag
        required: true
        default: true
        type: boolean

  workflow_call:
    inputs:
      version_tag:
        description: Release tag to publish, for example v1.2.3
        required: true
        type: string
      image_name:
        description: Optional image name under ghcr.io/<owner>/...
        required: false
        default: ""
        type: string
      publish_latest:
        description: Also publish the latest tag
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go build
        run: go build ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          default_image="$(basename "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          image_name="${{ inputs.image_name }}"

          if [[ -z "${image_name}" ]]; then
            image_name="${default_image}"
          fi

          image_name="$(echo "${image_name}" | tr '[:upper:]' '[:lower:]')"
          image="${REGISTRY}/${owner}/${image_name}"

          echo "image=${image}" >> "${GITHUB_OUTPUT}"

          {
            echo "tags<<EOF"
            echo "${image}:${{ inputs.version_tag }}"
            if [[ "${{ inputs.publish_latest }}" == "true" ]]; then
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version_tag }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max
